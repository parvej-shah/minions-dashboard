name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Lint n8n workflows
        run: npm run n8n:lint

      - name: Unit, contract and prompt-golden tests
        run: npm test

      - name: Architecture page is current
        run: npm run n8n:docs -- --check
