name: Supabase Daily Database Backup

on:
  schedule:
    # Runs daily at 02:00 UTC (08:00 AM Asia/Dhaka)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days of backups to retain in storage'
        required: false
        default: '30'

jobs:
  backup-supabase:
    name: Backup Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || 'minions-assets' }}
      R2_EP: ${{ secrets.R2_ENDPOINT }}
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client & Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget ca-certificates lsb-release gzip curl python3-pip
          sudo install -d /etc/apt/keyrings
          sudo wget --quiet -O /etc/apt/keyrings/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Prepare Backup Directory & Filename
        id: vars
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M%SZ")
          DATE_ONLY=$(date -u +"%Y-%m-%d")
          BACKUP_FILENAME="supabase_backup_${TIMESTAMP}.sql.gz"
          BACKUP_PATH="${RUNNER_TEMP}/${BACKUP_FILENAME}"
          echo "filename=${BACKUP_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "backup_path=${BACKUP_PATH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE_ONLY}" >> "$GITHUB_OUTPUT"

      - name: Execute pg_dump from Supabase
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL or DATABASE_URL secret is missing in GitHub repository secrets."
            exit 1
          fi

          echo "Starting database dump from Supabase..."
          
          # Clean connection string (ensure port 5432 for session mode if coming from pooler)
          CLEAN_URL=$(echo "$DB_URL" | sed 's/:6543\//:5432\//' | sed 's/?pgbouncer=true//')

          pg_dump \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --quote-all-identifiers \
            --dbname="$CLEAN_URL" \
            | gzip -9 > "${{ steps.vars.outputs.backup_path }}"

          DUMP_SIZE=$(ls -lh "${{ steps.vars.outputs.backup_path }}" | awk '{print $5}')
          echo "Backup generated successfully. Compressed file size: ${DUMP_SIZE}"
          echo "dump_size=${DUMP_SIZE}" >> "$GITHUB_OUTPUT"
        id: dump

      - name: Upload Backup to Cloudflare R2 (S3-compatible)
        if: env.R2_ACCESS_KEY != '' && env.R2_SECRET_KEY != ''
        run: |
          pip install --break-system-packages boto3
          python3 - << 'EOF'
          import os, boto3
          from botocore.config import Config

          account_id = os.environ.get('R2_ACCOUNT')
          endpoint = os.environ.get('R2_EP') or (f"https://{account_id}.r2.cloudflarestorage.com" if account_id else "")
          bucket = os.environ.get('R2_BUCKET', 'minions-assets')
          filename = "${{ steps.vars.outputs.filename }}"
          backup_path = "${{ steps.vars.outputs.backup_path }}"

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=os.environ['R2_ACCESS_KEY'],
              aws_secret_access_key=os.environ['R2_SECRET_KEY'],
              region_name='auto',
              config=Config(s3={'addressing_style': 'path'})
          )

          print(f"Uploading {filename} to Cloudflare R2 bucket {bucket}/backups/...")
          s3.upload_file(backup_path, bucket, f"backups/{filename}")
          print("Uploaded to Cloudflare R2 successfully!")
          EOF

      - name: Save Backup as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.backup_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Send Telegram Alert Notification
        if: success() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          MESSAGE="<b>Supabase Daily Backup Completed</b>%0A%0A"
          MESSAGE+="<b>Timestamp:</b> <code>${{ steps.vars.outputs.date }}</code>%0A"
          MESSAGE+="<b>File:</b> <code>${{ steps.vars.outputs.filename }}</code>%0A"
          MESSAGE+="<b>Size:</b> <code>${{ steps.dump.outputs.dump_size }}</code>%0A"
          MESSAGE+="<b>Destination:</b> Cloudflare R2 + GitHub Artifacts%0A"
          MESSAGE+="<b>Status:</b> Success"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" > /dev/null || true

      - name: Notify on Failure
        if: failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          MESSAGE="<b>WARNING: Supabase Daily Backup FAILED!</b>%0A%0A"
          MESSAGE+="<b>Workflow:</b> Supabase Daily Database Backup%0A"
          MESSAGE+="<b>Run ID:</b> <code>${{ github.run_id }}</code>%0A"
          MESSAGE+="Please check GitHub Actions logs immediately."

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" > /dev/null || true
