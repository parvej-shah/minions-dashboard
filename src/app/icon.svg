<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1419" />
      <stop offset="100%" stop-color="#070B0F" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#0e5c63" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F2D3D" stroke-width="16" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#00C9A7" opacity="0.12" filter="url(#glow)" />

  <!-- Stylized Minions 'M' Glyphs -->
  <path d="M 120 370 L 120 160 L 210 300 L 256 230 L 302 300 L 392 160 L 392 370" 
        fill="none" 
        stroke="url(#tealGrad)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Coral Accent Node -->
  <circle cx="256" cy="142" r="24" fill="#ff6b4a" />
</svg>
