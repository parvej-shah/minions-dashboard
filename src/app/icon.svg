<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12242a" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="100%" stop-color="#ff522b" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F2D3D" stroke-width="12" />

  <!-- Bold White 'M' with Modern Geometric Stems -->
  <path d="M 120 370 L 120 150 L 220 290 L 256 240 L 292 290 L 392 150 L 392 370" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="50" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vibrant Coral .ai Dot Indicator -->
