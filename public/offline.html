<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b0f">
    <title>You’re offline · Minions.AI</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #070b0f; color: #f1f5f9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #1f2d3d; border-radius: 20px; background: #0d1520; }
      .mark { color: #00c9a7; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 16px 0 10px; font-size: clamp(24px, 7vw, 32px); line-height: 1.15; }
      p { color: #aab7c7; line-height: 1.6; }
      button { min-height: 48px; width: 100%; margin-top: 12px; border: 0; border-radius: 12px; background: #00c9a7; color: #07110f; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f1f5f9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Minions.AI</div>
      <h1>You’re offline</h1>
      <p>Your workspace needs an internet connection to load current ideas and publishing data. Reconnect, then try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
